name: release

# Push a tag like v0.1.0 to publish a release: every test runs first, then the GitHub release
# gets the source archive and the .deb, the APT repository on GitHub Pages gets the .deb, and
# the Homebrew tap gets the new formula.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  release:
    name: Publish the release
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Check the version and the changelog
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 tools/release_notes.py "$version" > "$RUNNER_TEMP/notes.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build the source archive and the .deb
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix="note-to-self-$VERSION/" -o "dist/note-to-self-$VERSION.tar.gz" "$GITHUB_REF_NAME"
          python3 tools/build_deb.py --out dist
          cp "dist/note-to-self_${VERSION}_all.deb" dist/note-to-self_all.deb # a stable name for "latest" links
          (cd dist && sha256sum -- * > SHA256SUMS)
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "Note to Self $VERSION" --notes-file "$RUNNER_TEMP/notes.md"

  apt:
    name: Publish the APT repository
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      APT_KEY: ${{ secrets.APT_SIGNING_KEY }}
    steps:
      - name: Skip without a signing key
        if: env.APT_KEY == ''
        run: echo "::notice::APT_SIGNING_KEY isn't set, so the APT repository wasn't published. See RELEASING.md."
      - uses: actions/checkout@v5
        if: env.APT_KEY != ''
      - name: Build the signed repository
        if: env.APT_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern "note-to-self_${VERSION}_all.deb" --dir "$RUNNER_TEMP"
          export GNUPGHOME="$RUNNER_TEMP/gnupg" && mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$APT_KEY" | gpg --batch --import
          key=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          python3 tools/apt_repo.py --out site --key "$key" "$RUNNER_TEMP/note-to-self_${VERSION}_all.deb"
      - uses: actions/upload-pages-artifact@v5
        if: env.APT_KEY != ''
        with:
          path: site
      - uses: actions/deploy-pages@v4
        if: env.APT_KEY != ''
        id: deploy

  homebrew:
    name: Update the Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    env:
      TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
    steps:
      - name: Skip without the tap's deploy key
        if: env.TAP_KEY == ''
        run: echo "::notice::HOMEBREW_TAP_DEPLOY_KEY isn't set, so the Homebrew tap wasn't updated. See RELEASING.md."
      - uses: actions/checkout@v5
        if: env.TAP_KEY != ''
      - uses: actions/checkout@v5
        if: env.TAP_KEY != ''
        with:
          repository: human-genomics/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - name: Update the formula
        if: env.TAP_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern "note-to-self-$VERSION.tar.gz" --dir "$RUNNER_TEMP"
          python3 tools/formula.py "$VERSION" --tarball "$RUNNER_TEMP/note-to-self-$VERSION.tar.gz" \
            --out tap/Formula/note-to-self.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/note-to-self.rb
          git commit -m "note-to-self $VERSION"
          git push
